plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.10'
}

android {
    namespace 'kittoku.osc'

    compileSdk 36

    defaultConfig {
        applicationId "kittoku.osc.gate"
        minSdk 23
        targetSdk 36
        versionCode 52
        versionName "1.10.3-gate.2"

        // where the app pulls the refreshed VPN Gate list from (owner/repo, set by Actions)
        buildConfigField "String", "SERVER_REPO", "\"${System.getenv("GITHUB_REPOSITORY") ?: ""}\""

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            // private key from Actions secrets if set, otherwise the shared key in the repo
            // (fixed key = each new APK installs as an update over the previous one)
            def store = System.getenv("SIGN_STORE")
            if (store != null) {
                storeFile file(store)
                storePassword System.getenv("SIGN_STORE_PASS")
                keyAlias System.getenv("SIGN_KEY_ALIAS")
                keyPassword System.getenv("SIGN_KEY_PASS")
            } else {
                storeFile file("gate-shared.jks")
                storePassword "android"
                keyAlias "gate"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation 'com.google.android.material:material:1.13.0'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.2'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
