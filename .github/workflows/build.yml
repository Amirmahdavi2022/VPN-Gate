name: build apk

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["tools/**", "**.md", ".github/workflows/servers.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: android sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -20
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGN_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: build
        env:
          SIGN_STORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          SIGN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGN_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: rename
        run: |
          mkdir out
          ver=$(grep -m1 versionName app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          cp app/build/outputs/apk/release/*.apk "out/OpenSSTP-Gate-${ver}.apk"
          echo "VER=${ver}" >> "$GITHUB_ENV"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      # every build on main publishes/updates the release for its versionName
      - name: release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.apk
          body: |
            تب SERVERS: لیست خودکار سرورهای SSTP وی‌پی‌ان گیت، تست روی نت خودت، Quick connect و رفتن خودکار سراغ سرور بعدی اگه یکی قطع شد.

            فایل APK رو از پایین همین صفحه بگیر.
