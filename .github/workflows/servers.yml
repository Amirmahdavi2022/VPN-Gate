name: refresh servers

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: servers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: fetch list
        run: python3 tools/fetch_servers.py /tmp/servers.json

      - name: publish to data branch
        run: |
          mkdir /tmp/pub && cd /tmp/pub
          git init -q -b data
          cp /tmp/servers.json .
          git config user.name "AM.JMC"
          git config user.email "AM.JMC@users.noreply.github.com"
          git add servers.json
          git commit -qm "servers $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: purge jsdelivr cache
        continue-on-error: true
        run: curl -s -m 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/servers.json" || true
